[project]
name = "agents-tree"
version = "0.1.0"
description = "TUI that visualises Claude Code agents (main session, subagents, advisor, JEV) as a live tree"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agents-tree = "agents_tree.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents_tree", "agents_tree.sources", "agents_tree.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
